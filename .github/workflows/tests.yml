name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.4']

    name: PHP ${{ matrix.php }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, dom, curl, mbstring
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: ./vendor/bin/pest

      - name: Check code style
        run: ./vendor/bin/pint --test

  js-dist:
    runs-on: ubuntu-latest
    name: JS dist up to date

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: resources/js
        run: npm install

      - name: Build
        working-directory: resources/js
        run: npm run build

      - name: Fail if dist/ is stale
        run: git diff --exit-code -- resources/js/dist
